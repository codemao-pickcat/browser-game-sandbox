name: Publish package

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    name: Test and publish GitHub npm package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete test suite
        run: npm run test:all

      - name: Synchronize package version with tag
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match v*.*.*: $tag"
            exit 1
          fi
          current_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$current_version" != "$version" ]]; then
            npm version "$version" --no-git-tag-version
          fi

      - name: Verify published package contents
        shell: bash
        run: npm run check:package

      - name: Build package artifact
        run: mkdir -p artifacts && npm pack --pack-destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: browser-game-sandbox-package-${{ env.RELEASE_TAG }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
