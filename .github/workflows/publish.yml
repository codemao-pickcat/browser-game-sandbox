name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Test and publish GitHub npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete test suite
        run: npm run test:all

      - name: Synchronize package version with tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match v*.*.*: $tag"
            exit 1
          fi
          current_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$current_version" != "$version" ]]; then
            npm version "$version" --no-git-tag-version
          fi

      - name: Verify published package contents
        shell: bash
        run: |
          test -f dist/game.global.js
          node -e 'const pkg = JSON.parse(require("node:fs").readFileSync("package.json", "utf8")); if (pkg.publishConfig?.registry !== "https://npm.pkg.github.com") process.exit(1); if (!pkg.exports?.["./game.global.js"]) process.exit(1);'

      - name: Build package artifact
        run: mkdir -p artifacts && npm pack --pack-destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-game-sandbox-package-${{ github.ref_name }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
