name: Publish package

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    name: Test and publish GitHub npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      PLAYWRIGHT_IMAGE_VERSION: "1.64.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release must use an existing vX.Y.Z tag"
            exit 1
          fi
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Release tag does not match the successful CI commit"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify browser environment
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { chromium } from '@playwright/test';
          const require = createRequire(import.meta.url);
          const actual = require('@playwright/test/package.json').version;
          const expected = process.env.PLAYWRIGHT_IMAGE_VERSION;
          if (actual !== expected) {
            throw new Error(`Playwright ${actual} does not match container ${expected}`);
          }
          const browser = await chromium.launch();
          try {
            console.log(`Playwright ${actual}; Chromium ${browser.version()}`);
          } finally {
            await browser.close();
          }
          NODE

      - name: Run complete test suite
        run: npm run test:all

      - name: Synchronize package version with tag
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match v*.*.*: $tag"
            exit 1
          fi
          current_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$current_version" != "$version" ]]; then
            npm version "$version" --no-git-tag-version
          fi

      - name: Verify published package contents
        shell: bash
        run: npm run check:package

      - name: Build package artifact
        run: mkdir -p artifacts && npm pack --pack-destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: browser-game-sandbox-package-${{ env.RELEASE_TAG }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
