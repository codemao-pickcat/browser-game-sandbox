name: Publish sandbox release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in package.json, without v (for example, 0.5.1)"
        required: true
        type: string
      release_notes:
        description: "Release notes (Markdown)"
        required: true
        type: string
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}
  EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    name: Test and build npm tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    outputs:
      package_artifact_id: ${{ steps.package_artifact.outputs.artifact-id }}
    env:
      PLAYWRIGHT_IMAGE_VERSION: "1.64.1"
    steps:
      - name: Validate release inputs
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use an X.Y.Z version (without v in the manual form), or an existing vX.Y.Z tag"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$RELEASE_NOTES" =~ [^[:space:]] ]]; then
            echo "::error::Release notes are required"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag availability
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          if git -c "safe.directory=$GITHUB_WORKSPACE" show-ref --verify --quiet "$tag_ref"; then
            tag_sha="$(git -c "safe.directory=$GITHUB_WORKSPACE" rev-parse --verify "$tag_ref^{commit}")"
            if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
              echo "::error::$RELEASE_TAG already points to a different commit"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::$RELEASE_TAG was not found"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify SDK version
        run: |
          set -euo pipefail
          requested_version="${RELEASE_TAG#v}"
          sdk_version="$(node -p 'require("./package.json").version')"
          if [[ "$sdk_version" != "$requested_version" ]]; then
            echo "::error::Requested version $requested_version differs from SDK version $sdk_version. Bump the SDK in MOSS and sync the source before releasing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify browser environment
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { chromium } from '@playwright/test';
          const require = createRequire(import.meta.url);
          const actual = require('@playwright/test/package.json').version;
          const expected = process.env.PLAYWRIGHT_IMAGE_VERSION;
          if (actual !== expected) {
            throw new Error(`Playwright ${actual} does not match container ${expected}`);
          }
          const browser = await chromium.launch();
          try {
            console.log(`Playwright ${actual}; Chromium ${browser.version()}`);
          } finally {
            await browser.close();
          }
          NODE

      - name: Run complete test suite
        run: npm run test:all

      - name: Verify published package contents
        shell: bash
        run: npm run check:package

      - name: Build package artifact
        run: mkdir -p artifacts && npm pack --pack-destination artifacts

      - name: Upload package artifact
        id: package_artifact
        uses: actions/upload-artifact@v5
        with:
          name: browser-game-sandbox-package-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: artifacts/*.tgz
          if-no-files-found: error

  tag:
    name: Prepare release tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Create or verify release tag
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "$tag_ref"; then
            if [[ "$(git rev-parse --verify "$tag_ref^{commit}")" != "$EXPECTED_SHA" ]]; then
              echo "::error::$RELEASE_TAG already points to a different commit"
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              expected_notes="$(printf '%s' "$RELEASE_NOTES")"
              tag_notes="$(git for-each-ref --format='%(contents)' "$tag_ref")"
              if [[ "$(git cat-file -t "$tag_ref")" != tag || "$tag_notes" != "$expected_notes" ]]; then
                echo "::error::$RELEASE_TAG already exists with different release notes"
                exit 1
              fi
            fi
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::$RELEASE_TAG was not found"
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" | git \
            -c 'user.name=github-actions[bot]' \
            -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            -c tag.gpgSign=false \
            tag --annotate --cleanup=verbatim --file=- "$RELEASE_TAG" "$EXPECTED_SHA"
          git push --no-follow-tags origin "$tag_ref"

  publish:
    name: Publish npm tarball
    needs: [build, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download npm tarball
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.package_artifact_id }}
          path: artifacts

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - name: Publish to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tarball="artifacts/codemao-pickcat-browser-game-sandbox-${version}.tgz"
          registry=https://npm.pkg.github.com
          if npm publish "$tarball" --registry="$registry"; then
            exit 0
          fi

          # A retry may find that the previous publish already succeeded.
          published_integrity="$(
            npm view "@codemao-pickcat/browser-game-sandbox@${version}" dist.integrity --json --registry="$registry" \
              | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8"))'
          )"
          tarball_hash="$(node -e 'const data = require("node:fs").readFileSync(process.argv[1]); console.log(require("node:crypto").hash("sha512", data, "base64"))' "$tarball")"
          if [[ "$published_integrity" != "sha512-$tarball_hash" ]]; then
            echo "::error::Registry package integrity does not match the release tarball"
            exit 1
          fi
          echo "This tarball is already published at version ${version}."

  release:
    name: Publish GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download published npm tarball
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.package_artifact_id }}
          path: artifacts

      - name: Publish release notes and npm tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::Release tag no longer points to the published commit"
            exit 1
          fi
          tarball="artifacts/codemao-pickcat-browser-game-sandbox-${RELEASE_TAG#v}.tgz"
          local_digest="sha256:$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          view_error="$RUNNER_TEMP/release-view-error"
          if ! release="$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>"$view_error")"; then
            if ! grep -Fxq 'release not found' "$view_error"; then
              cat "$view_error" >&2
              exit 1
            fi
            notes=(--generate-notes)
            if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]; then
              notes=(--notes-from-tag)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" "${notes[@]}"
            release="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
          fi

          asset_digest="$(jq -r --arg name "${tarball##*/}" '.assets[] | select(.name == $name) | .digest // "unknown"' <<<"$release")"
          if [[ -z "$asset_digest" ]]; then
            gh release upload "$RELEASE_TAG" "$tarball"
          elif [[ "$asset_digest" != "$local_digest" ]]; then
            echo "::error::Existing release asset does not match the published npm tarball"
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<<"$release")" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
