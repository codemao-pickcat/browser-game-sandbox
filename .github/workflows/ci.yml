name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node-version }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build, type checks, and protocol tests
        run: npm run check

  vue:
    name: SDK-free Vue 3 native API build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Build SDK-free Vue fixture
        run: npm run test:vue

  browser:
    name: Chromium browser sandbox tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    env:
      PLAYWRIGHT_IMAGE_VERSION: "1.64.1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Verify browser environment
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { chromium } from '@playwright/test';
          const require = createRequire(import.meta.url);
          const actual = require('@playwright/test/package.json').version;
          const expected = process.env.PLAYWRIGHT_IMAGE_VERSION;
          if (actual !== expected) {
            throw new Error(`Playwright ${actual} does not match container ${expected}`);
          }
          const browser = await chromium.launch();
          try {
            console.log(`Playwright ${actual}; Chromium ${browser.version()}`);
          } finally {
            await browser.close();
          }
          NODE

      - name: Run browser tests
        run: npm run test:browser
